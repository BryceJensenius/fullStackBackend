name: Deploy Project
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  getEc2InstanceIp:
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.get_public_ip.outputs.public_ip }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Get EC2 Instance Public IP
        id: get_public_ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.AWS_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "Public IP is: $PUBLIC_IP"
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
  deploy-project:
    needs: [getEc2InstanceIp]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Maven Clean and Package
        id: maven_build
        run: |
          mvn clean package
          echo "Build completed successfully."
      - name: upload JAR to EC2
        id: upload_jar
        run: |
          echo "Uploading JAR to EC2 instance..."
          scp -i ${{ secrets.RSA_PRIVATE_KEY }} \
            target/*.jar \
            ec2-user@${{ needs.getEc2InstanceIp.outputs.public_ip }}:/home/ec2-user/
          echo "JAR uploaded successfully."