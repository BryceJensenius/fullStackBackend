name: Deploy Project
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  getEc2InstanceIp:
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.get_public_ip.outputs.public_ip }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Get EC2 Instance Public IP
        id: get_public_ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.AWS_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "Public IP is: $PUBLIC_IP"
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
  deploy-project:
    needs: [getEc2InstanceIp]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Maven Clean and Package
        id: maven_build
        run: |
          mvn clean package # Package the application to get JAR file
          echo "Build completed successfully."
      - name: upload JAR to EC2
        id: upload_jar
        run: |
          echo "Uploading JAR to EC2 instance..."
          echo "${{ secrets.RSA_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem # Create key file with Read/Write permissions for the owner

          echo "Copying JAR file to EC2 instance..."
          # StrictHostKeyChecking is set to no to avoid host key verification issues
          scp -o StrictHostKeyChecking=no -i key.pem target/*.jar ec2-user@${{ needs.getEc2InstanceIp.outputs.public_ip }}:/home/ec2-user/
          echo "JAR uploaded successfully."

          # Upload environment file with secrets
          echo "Creating environment file with database credentials..."
          # Create Environment file which maps variable to values automatically
          # these three variables are used in the application.properties file automatically
          cat <<EOF > javaapp.env
          SPRING_DATASOURCE_URL=jdbc:postgresql://mariadb.cr2k00yesbe9.us-east-2.rds.amazonaws.com:5432/postgres?sslmode=require
          SPRING_DATASOURCE_USERNAME=postgres
          SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

          echo "Environment file created successfully.""
          echo "Uploading environment file to EC2 instance..."
          # StrictHostKeyChecking is set to no to avoid host key verification issues
          scp -o StrictHostKeyChecking=no -i key.pem javaapp.env ec2-user@${{ needs.getEc2InstanceIp.outputs.public_ip }}:/tmp/javaapp.env
  restartProject:
    needs: [deploy-project, getEc2InstanceIp]
    runs-on: ubuntu-latest
    steps:
      - name: Restart Application on EC2
        run: |
          echo "Restarting application on EC2 instance..."
          echo "${{ secrets.RSA_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
          # Everything between the EOF markers is executed on the remote EC2 instance
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@${{ needs.getEc2InstanceIp.outputs.public_ip }} << EOF
            # Ensure env directory exists
            sudo mkdir -p /etc/javaapp

            # Write environment file
            echo "SPRING_DATASOURCE_URL=jdbc:postgresql://mariadb.cr2k00yesbe9.us-east-2.rds.amazonaws.com:5432/postgres?sslmode=require" | sudo tee /etc/javaapp/javaapp.env > /dev/null
            echo "SPRING_DATASOURCE_USERNAME=postgres" | sudo tee -a /etc/javaapp/javaapp.env > /dev/null
            echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" | sudo tee -a /etc/javaapp/javaapp.env > /dev/null

            sudo chmod 600 /etc/javaapp/javaapp.env # Set permissions to read/write for the owner only
            sudo chown root:root /etc/javaapp/javaapp.env # Ensure the file is owned by root so it can be read by the service

            # Restart service and check
            sudo systemctl daemon-reload
            sudo systemctl restart javaapp
            sleep 5
            # Check if the service is active
            # If the service fails to start, print the logs and exit with an error
            sudo systemctl is-active --quiet javaapp || (echo "Service failed to start!" && sudo journalctl -u javaapp --no-pager && exit 1)
          EOF
